  S.data.nav.concat(S.data.categories).forEach(function (c) { catPaths[c.path] = c; });

    return '<div class="st">' + S.Header({ active: active }) + (crumbs ? S.Breadcrumb({ items: crumbs }) : '') + '<main id="main">' + inner + '</main>' + S.Footer() + '</div>';
  }
  function articleStub(a) {
    var cat = S.data.categories.filter(function (c) { return c.id === a.cat || (a.cat === 'turf' && c.id === 'garden'); })[0] || S.data.categories[0];
    var same = S.data.articles.filter(function (x) { return x.id !== a.id && x.cat === a.cat; }).slice(0, 3).map(function (x) { return x.id; });
    if (same.length < 3) same = same.concat(['fence-guide', 'turf-cost', 'garden-guide'].filter(function (id) { return id !== a.id && same.indexOf(id) < 0; })).slice(0, 3);
    return shell(cat.id, [{ name: 'ホーム', path: '/' }, { name: cat.name, path: cat.path }, { name: a.title }],
      '<div class="st-container"><div class="st-article-wrap"><div><article>' + S.ArticleHeader({ article: a, lead: a.desc }) +

      '<aside class="st-side" aria-label="サイドバー">' + S.Ranking({ id: 'stub-rk' }) + S.ConsultBox() + '</aside></div></div>');
  }
  function categoryList(c) {

    return shell(c.id, [{ name: 'ホーム', path: '/' }, { name: c.name }],
      '<div class="st-container st-wip"><p class="st-sechead__en">CATEGORY</p><h1 class="st-catlist__title">' + S.esc(c.name) + '</h1>' +

  }

    return shell('', [{ name: 'ホーム', path: '/' }, { name: 'ページ準備中' }],

  var NAMES = { '/column/': 'column', '/': 'top', '/exterior/fence/fence-guide/': 'article', '/garden/turf/': 'turf', '/campaign/autumn-2026/': 'campaign' };

    document.title = seo ? seo.title : 'ページが見つかりません｜SOTORINO';
    var m = document.querySelector('meta[name=description]'); if (!m) { m = document.createElement('meta'); m.name = 'description'; document.head.appendChild(m); }

    var ld = document.getElementById('st-ld'); if (ld) ld.remove();
    if (seo && seo.ld && seo.ld.length) { ld = document.createElement('script'); ld.type = 'application/ld+json'; ld.id = 'st-ld'; ld.textContent = JSON.stringify(seo.ld); document.head.appendChild(ld); }
  }
  function render(path, keepScroll) {
    path = String(path).split('#')[0];
    var r = S.route(path);
    if (!r) { var a = S.data.articles.filter(function (x) { return x.path === path; })[0]; r = { html: a ? articleStub(a) : S.NotFoundPage(), seo: null }; }
    app.innerHTML = r.html;
    setSeo(r.seo);
    S.mount(app);
    if (!keepScroll) window.scrollTo(0, 0);
    var name = NAMES[path];
    try { if (name && location.hash.slice(1) !== name) history.replaceState(null, '', '#' + name); } catch (e) {}
